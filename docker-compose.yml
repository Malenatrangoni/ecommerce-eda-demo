services:
  # ==========================================
  # Broker de Mensajería: RabbitMQ con Panel Web
  # ==========================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: broker-rabbitmq
    ports:
      - "5672:5672"     # Puerto AMQP
      - "15672:15672"   # Panel de Administración Web
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - red-eda

  # ==========================================
  # Microservicio Productor: API de Pedidos
  # ==========================================
  api-pedidos:
    build:
      context: ./api-pedidos
      dockerfile: Dockerfile
    container_name: productor-api-pedidos
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      PUERTO: 3000
      URL_RABBITMQ: amqp://guest:guest@rabbitmq:5672
      URL_ADMIN_RABBITMQ: http://rabbitmq:15672
      NOMBRE_INTERCAMBIADOR: intercambiador_pedidos
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - red-eda

  # ==========================================
  # Suscriptor 1: Servicio de Inventario (pedido.creado, pedido.cancelado)
  # ==========================================
  servicio-inventario:
    build:
      context: ./servicio-inventario
      dockerfile: Dockerfile
    container_name: consumidor-inventario
    restart: on-failure
    environment:
      URL_RABBITMQ: amqp://guest:guest@rabbitmq:5672
      URL_API_PEDIDOS: http://api-pedidos:3000
      NOMBRE_INTERCAMBIADOR: intercambiador_pedidos
      NOMBRE_COLA: cola_inventario
      INTERCAMBIADOR_DLQ: intercambiador_dlq
      COLA_DLQ: cola_mensajes_muertos
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - red-eda

  # ==========================================
  # Suscriptor 2: Servicio de Facturación (pedido.creado, pedido.cancelado)
  # ==========================================
  servicio-facturacion:
    build:
      context: ./servicio-facturacion
      dockerfile: Dockerfile
    container_name: consumidor-facturacion
    restart: on-failure
    environment:
      URL_RABBITMQ: amqp://guest:guest@rabbitmq:5672
      URL_API_PEDIDOS: http://api-pedidos:3000
      NOMBRE_INTERCAMBIADOR: intercambiador_pedidos
      NOMBRE_COLA: cola_facturacion
      INTERCAMBIADOR_DLQ: intercambiador_dlq
      COLA_DLQ: cola_mensajes_muertos
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - red-eda

  # ==========================================
  # Suscriptor 3: Servicio de Envíos (solo pedido.creado)
  # ==========================================
  servicio-envios:
    build:
      context: ./servicio-envios
      dockerfile: Dockerfile
    container_name: consumidor-envios
    restart: on-failure
    environment:
      URL_RABBITMQ: amqp://guest:guest@rabbitmq:5672
      URL_API_PEDIDOS: http://api-pedidos:3000
      NOMBRE_INTERCAMBIADOR: intercambiador_pedidos
      NOMBRE_COLA: cola_envios
      INTERCAMBIADOR_DLQ: intercambiador_dlq
      COLA_DLQ: cola_mensajes_muertos
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - red-eda

  # ==========================================
  # Suscriptor 4: Servicio de Notificaciones y Auditoría (comodín pedido.#)
  # ==========================================
  servicio-notificaciones:
    build:
      context: ./servicio-notificaciones
      dockerfile: Dockerfile
    container_name: consumidor-notificaciones
    restart: on-failure
    environment:
      URL_RABBITMQ: amqp://guest:guest@rabbitmq:5672
      URL_API_PEDIDOS: http://api-pedidos:3000
      NOMBRE_INTERCAMBIADOR: intercambiador_pedidos
      NOMBRE_COLA: cola_notificaciones
      INTERCAMBIADOR_DLQ: intercambiador_dlq
      COLA_DLQ: cola_mensajes_muertos
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - red-eda

networks:
  red-eda:
    driver: bridge
